name: research-integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q 02_showdown scripts tests

      - name: Run regression and integrity tests
        run: python -m pytest -q

      - name: Check tracked-file hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)private/|(^|/)\.env$|__pycache__|\.pyc$'; then
            echo "Tracked private, environment, or cache file detected."
            exit 1
          fi
          if git grep -nE '/Users/[[:alnum:]_]' -- ':!docs/research/history/**'; then
            echo "Absolute local user path detected."
            exit 1
          fi
